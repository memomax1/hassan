<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفيديوهات</title>
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <style>
    *{box-sizing:border-box;margin:0}
    body{background:#111;color:#fff;font-family:system-ui,sans-serif;
         display:flex;flex-direction:column;align-items:center;gap:20px;padding:16px}
    #list{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;width:100%}
    .video{width:100%;max-width:320px;aspect-ratio:9/16;border-radius:12px;
           overflow:hidden;background:#000}
    iframe{width:100%;height:100%;border:0}
    a.btn{background:#22c55e;color:#fff;text-decoration:none;
          padding:12px 28px;border-radius:8px;font-weight:700}
  </style>
</head>
<body>
  <div id="list"></div>

  <a class="btn" href="https://lltrco.com/?r=mahmoudyoussef20" target="_blank" rel="noopener">
    سجّل من هنا
  </a>

  <script>
    var IDS = ["dvVSRT5mMgQ", "kB5jj3V1b5E", "Pps5L0lQ7ug"];
    var list = document.getElementById("list");

    IDS.forEach(function (id) {
      var box = document.createElement("div");
      box.className = "video";
      box.innerHTML =
        '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
        '?autoplay=1&mute=1&rel=0&playsinline=1" ' +
        'allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen ' +
        'title="فيديو"></iframe>';
      list.appendChild(box);
    });
  </script>
</body>
</html>
